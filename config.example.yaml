# AWX / AAP rollout report config.
#
# Token: prefer the AWX_TOKEN environment variable. For scheduled runs with
# no shell available to set it, the token may instead be set with the
# `token` key below; AWX_TOKEN still overrides it when set. If the token
# lives in this file, restrict its permissions (e.g. chmod 600) so it is
# not readable by other users on the host.
# token: ""

# Base URL of the AWX/AAP controller. No trailing slash.
base_url: "https://awx.dev.example.local"

# API root. AWX 24.x: /api/v2  |  AAP 2.5+: /api/controller/v2
api_root: "/api/v2"

# How many days of history to include in the report.
days_back: 30

# Request pacing.
page_size: 200 # AWX max is 200
request_pacing_ms: 200 # sleep between page fetches
http_timeout_sec: 60
max_retries: 5 # retries on 429 / 5xx with exponential backoff

# TLS. Set to true ONLY for dev with self-signed certs.
insecure_skip_verify: true

# Output.
output_dir: "./out" # XLSX + CSV land here
debug_dir: "" # set to a path (e.g. "./debug") to dump every JSON page

# Exclude noisy templates (e.g. service health checks) from aggregates.
# Matches are case-insensitive. A template hits the filter if its ID is in `ids`
# OR its name contains any of the substrings in `name_contains`.
# Excluded templates still appear in their own sheet so you can audit the filter.
exclude_templates:
  ids: []
  name_contains:
    - "health check"
    - "service probe"
    - "heartbeat"

# Selective mode: scope the report to specific job templates and/or projects
# instead of walking every job. Empty lists (the default) mean a full report.
# Listing template_ids and/or project_ids switches to selective mode.
# Project ids are resolved to their current job templates at run time.
# exclude_templates always wins: a template matching both include and
# exclude_templates is removed from the selection.
include:
  template_ids: []
  project_ids: []
